<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Flow Therapy, trio musical martégual. Musique originale, actualités, galerie média et réseaux sociaux.">
  <meta name="theme-color" content="#fbf8f2">
  <title>Flow Therapy</title>
  <link rel="icon" href="assets/generated/logo-transparent-320.png" type="image/png">
  <link rel="stylesheet" href="styles.css?v=20260820-contact-modal">
  <link rel="stylesheet" href="travel-landscapes.css?v=20260821-travel-performance">
  <script type="module" src="app.js?v=20260821-responsive-gallery"></script>
  <script type="module" src="travel-landscapes.js?v=20260821-travel-performance"></script>
</head>
<body>
  <main id="app" class="page" aria-live="polite">
    <p class="loading">Chargement de Flow Therapy…</p>
  </main>

  <dialog id="media-dialog" class="media-dialog" aria-labelledby="media-viewer-title">
    <div class="media-viewer">
      <header class="media-viewer-header">
        <div>
          <p id="media-counter" class="media-counter" aria-live="polite"></p>
          <h2 id="media-viewer-title"></h2>
        </div>
        <div class="media-viewer-tools">
          <button id="media-info" class="media-tool" type="button" aria-expanded="false" aria-controls="media-meta">Infos</button>
          <button id="media-close" class="media-close" type="button" aria-label="Fermer la galerie">×</button>
        </div>
      </header>
      <div class="media-stage">
        <button id="media-prev" class="media-arrow media-prev" type="button" aria-label="Média précédent">‹</button>
        <div id="media-visual" class="media-viewer-visual"></div>
        <button id="media-next" class="media-arrow media-next" type="button" aria-label="Média suivant">›</button>
      </div>
      <div id="media-meta" class="media-meta" hidden>
        <dl>
          <div><dt>Type</dt><dd id="media-type"></dd></div>
          <div><dt>Format</dt><dd id="media-ratio"></dd></div>
          <div><dt>Date</dt><dd id="media-date"></dd></div>
          <div><dt>Crédit</dt><dd id="media-credit"></dd></div>
        </dl>
        <p id="media-description"></p>
      </div>
    </div>
  </dialog>

  <dialog id="qr-dialog" class="qr-dialog" aria-labelledby="qr-title">
    <button id="qr-close" class="qr-close" type="button" aria-label="Fermer le QR code">×</button>
    <div class="qr-content">
      <h2 id="qr-title">Flashez, puis partagez&nbsp;!</h2>
      <div id="qr-code" class="qr-code" aria-label="QR code du site"></div>
    </div>
  </dialog>
  <dialog id="contact-dialog" class="contact-dialog" aria-labelledby="contact-title">
    <div class="contact-panel">
      <button id="contact-close" class="contact-close" type="button" aria-label="Fermer le formulaire">×</button>
      <header class="contact-heading">
        <span class="contact-heading-icon" aria-hidden="true">✉</span>
        <div>
          <p>Une question, un projet&nbsp;?</p>
          <h2 id="contact-title">Nous contacter</h2>
        </div>
      </header>
      <form id="contact-form" class="contact-form">
        <label for="contact-subject">Sujet</label>
        <select id="contact-subject" name="subject" required>
          <option value="">Choisir un sujet</option>
          <option>Concert / programmation</option>
          <option>Événement privé ou professionnel</option>
          <option>Presse / média</option>
          <option>Collaboration artistique</option>
          <option>Dossier de presse / fiche technique</option>
          <option>Autre demande</option>
        </select>
        <label for="contact-email">Adresse e-mail</label>
        <input id="contact-email" name="email" type="email" autocomplete="email" required placeholder="votre.nom@exemple.fr">
        <label for="contact-phone">Numéro de téléphone <span>(facultatif)</span></label>
        <input id="contact-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+33 6 00 00 00 00">
        <div class="contact-message-label"><label for="contact-message">Votre message</label><span><output id="contact-count">0</output>/255</span></div>
        <textarea id="contact-message" name="message" maxlength="255" rows="5" required placeholder="Décrivez votre demande…"></textarea>
        <button class="contact-submit" type="submit" disabled>Envoi bientôt disponible</button>
        <p class="contact-notice">Le formulaire est en préparation. L’envoi des messages sera activé prochainement.</p>
      </form>
    </div>
  </dialog>
  <noscript>Ce site nécessite JavaScript pour charger son contenu.</noscript>
</body>
</html>
