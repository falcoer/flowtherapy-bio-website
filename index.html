<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Flow Therapy, trio musical martégual. Musique originale, actualités, réseaux sociaux et dossier de presse.">
  <meta name="theme-color" content="#fbf8f2">
  <title>Flow Therapy</title>
  <link rel="icon" href="assets/logo_transparent.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="app" class="page" aria-live="polite">
    <p class="loading">Chargement de Flow Therapy…</p>
  </main>
  <dialog id="qr-dialog" class="qr-dialog" aria-labelledby="qr-title">
    <button id="qr-close" class="qr-close" type="button" aria-label="Fermer le QR code">×</button>
    <div class="qr-content">
      <img class="qr-logo" src="assets/logo_transparent.png" alt="Flow Therapy">
      <h2 id="qr-title">Partager Flow Therapy</h2>
      <div id="qr-code" class="qr-code" aria-label="QR code du site"></div>
      <p id="qr-url" class="qr-url"></p>
    </div>
  </dialog>
  <noscript>Ce site nécessite JavaScript pour charger son contenu.</noscript>
</body>
</html>
