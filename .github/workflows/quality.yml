name: Validate generated site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-assets.txt

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned asset transformers
        run: python -m pip install --requirement requirements-assets.txt

      - name: Restore generated asset cache
        uses: actions/cache@v4
        with:
          path: |
            dist/assets
            dist/assets-manifest.json
          key: generated-assets-${{ runner.os }}-py3.13-${{ hashFiles('assets-src/**', 'tools/build-site.py', 'tools/build-travel-landscapes.py', 'requirements-assets.txt') }}
          restore-keys: |
            generated-assets-${{ runner.os }}-py3.13-

      - name: Build immutable sources
        run: |
          python tools/build-site.py
          python tools/build-travel-landscapes.py

      - name: Check JavaScript
        run: |
          node --check app.js
          node --check travel-landscapes.js

      - name: Validate generated output
        run: node tools/validate-site.mjs dist

      - name: Install browser smoke runtime
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          python -m http.server 4173 --directory dist > /tmp/flowtherapy-http.log 2>&1 &
          echo $! > /tmp/flowtherapy-http.pid

      - name: Verify public root and i18n preview
        run: npx playwright test tools/i18n-smoke.spec.mjs --reporter=line

      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-browser-captures
          path: test-results
          if-no-files-found: ignore
