name: Validate generated site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned asset transformers
        run: python -m pip install --requirement requirements-assets.txt

      - name: Build immutable sources
        run: python tools/build-site.py

      - name: Check JavaScript
        run: node --check app.js

      - name: Validate generated output
        run: node tools/validate-site.mjs dist
